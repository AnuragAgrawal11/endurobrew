<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#14121F;color:#fff;font-family:Inter,system-ui,sans-serif;padding:24px}
.box{width:100%;max-width:420px;background:#232039;border:1px solid #3A3656;border-radius:28px;padding:36px}
h1{font-family:'Space Grotesk',sans-serif;font-size:44px;margin:0 0 6px;letter-spacing:-1px}
h1 span{color:#C8F169}
p{color:#CFCDE0;margin:0 0 22px;font-size:15px;line-height:1.5}
label{display:block;font-weight:600;font-size:14px;margin-bottom:8px}
input{width:100%;font:500 17px Inter,sans-serif;padding:14px 16px;border-radius:14px;border:2px solid #3A3656;background:#14121F;color:#fff;min-height:48px}
input:focus{outline:none;border-color:#5EE6C0}
button{margin-top:14px;width:100%;font:700 16px Inter,sans-serif;padding:14px;border:0;border-radius:14px;background:#C8F169;color:#14121F;cursor:pointer;min-height:48px}
button:disabled{opacity:.6;cursor:wait}
#err{color:#FF8A70;font-size:14px;min-height:20px;margin-top:10px}
.lock{width:48px;height:48px;border-radius:14px;background:#C8F169;display:flex;align-items:center;justify-content:center;margin-bottom:18px}
</style>

function b64(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0);});}
async function unlock(pw){
  var enc=new TextEncoder();
  var base=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.s),iterations:P.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  var buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.i)},key,b64(P.d));
  return new TextDecoder().decode(buf);
}
function render(html){var h=location.hash;document.open();document.write(html);document.close();if(h){setTimeout(function(){location.hash='';location.hash=h;},300);}}
document.getElementById('f').addEventListener('submit',async function(e){
  e.preventDefault();
  var b=document.getElementById('go'),err=document.getElementById('err'),pw=document.getElementById('pw').value;
  b.disabled=true;b.textContent='Unlocking…';err.textContent='';
  try{var html=await unlock(pw);try{sessionStorage.setItem('eb_pw',pw);}catch(x){}render(html);}
  catch(x){err.textContent='Wrong password — try again.';b.disabled=false;b.textContent='Unlock plan';}
});
(async function(){try{var s=sessionStorage.getItem('eb_pw');if(s){render(await unlock(s));}}catch(x){}})();
